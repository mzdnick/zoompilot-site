# Watch upstream for a new release and open a PR with a skeleton
# changelog entry.
#
# - daily cron (13:07 UTC) + manual dispatch
# - scripts/watch-release.mjs compares upstream's version.h on main
#   with the newest changelog entry; on divergence it inserts a
#   skeleton and this workflow opens the pull request
# - a human fills in the real notes and merges; merge = deploy
#
# Needs no secrets: GITHUB_TOKEN is the workflow's own.
name: release watch

on:
  schedule:
    - cron: "7 13 * * *" # daily, 13:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: check upstream for a new release
        run: node scripts/watch-release.mjs --apply
      - name: open a release PR when the changelog changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/changelog.js; then
            echo "changelog already current"
            exit 0
          fi
          VER=$(cat .release-version)
          BR="release-watch/$VER"
          git config user.name "release-watch"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BR"
          git add src/data/changelog.js
          git commit -m "chore: skeleton changelog entry for $VER"
          if gh pr list --head "$BR" --state open | grep -q .; then
            echo "a release PR for $VER is already open"
            exit 0
          fi
          git push origin "$BR"
          gh pr create \
            --head "$BR" \
            --title "New upstream release: $VER" \
            --body "Upstream \`version.h\` reports **$VER**, but the changelog's newest entry is older. This PR adds a skeleton entry at the top of \`src/data/changelog.js\`: fill in the real notes, adjust the date, and merge — merging deploys the site.

