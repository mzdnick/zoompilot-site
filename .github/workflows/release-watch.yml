# Watch upstream for a new release and open a PR with a skeleton
# changelog entry.
#
# - daily cron (13:07 UTC) + manual dispatch
# - scripts/watch-release.mjs compares upstream's version.h on main
#   with the newest changelog entry; on divergence it inserts a
#   skeleton and this workflow opens the pull request
# - scripts/watch-settings.mjs hashes the settings definition files;
#   on change it rides along in the release PR body, or opens a
#   "Settings drift" issue when no release PR is due
# - a human fills in the real notes and merges; merge = deploy
#
# Needs no secrets: GITHUB_TOKEN is the workflow's own.
name: release watch

on:
  schedule:
    - cron: "7 13 * * *" # daily, 13:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: check upstream for a new release
        run: node scripts/watch-release.mjs --apply
      - name: watch settings definitions
        run: node scripts/watch-settings.mjs --apply
      - name: open a release PR, or report settings drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/changelog.js; then
            echo "changelog already current"
            if [ -s .settings-changed ]; then
              if gh issue list --state open --search "Settings drift" | grep -q .; then
                echo "a Settings drift issue is already open"
                exit 0
              fi
              {
                echo "Upstream's settings definitions changed on main:"
                echo
                echo '```'
                cat .settings-changed
                echo '```'
                echo
                echo "After the wiki catches up this file is baseline again. Fix: update \`docs/assets/js/settings-data.js\` in zoompilot/wiki to match, and regenerate the settings captures if a panel changed."
              } > body.md
              gh issue create --title "Settings drift on upstream main" --body-file body.md
              git config user.name "release-watch"
              git config user.email "actions@users.noreply.github.com"
              git add scripts/settings-watch.json
              git commit -m "chore: settings watch baseline after drift"
              git push origin main
            fi
            exit 0
          fi
          VER=$(cat .release-version)
          BR="release-watch/$VER"
          git config user.name "release-watch"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BR"
          git add src/data/changelog.js scripts/settings-watch.json
          git commit -m "chore: skeleton changelog entry for $VER"
          if gh pr list --head "$BR" --state open | grep -q .; then
            echo "a release PR for $VER is already open"
            exit 0
          fi
          git push origin "$BR"
          BODY="Upstream \`version.h\` reports **$VER**, but the changelog's newest entry is older. This PR adds a skeleton entry at the top of \`src/data/changelog.js\`: fill in the real notes, adjust the date, and merge — merging deploys the site."
          if [ -s .settings-changed ]; then
            BODY="$BODY"$'\n\n'"## Settings watch"$'\n\n'"Upstream's settings definitions also changed:"$'\n\n```'"$(cat .settings-changed)"'```'"$'\n\n'"After merging: update \`docs/assets/js/settings-data.js\` in zoompilot/wiki to match, and regenerate the settings captures if a panel changed."
          fi
          BODY="$BODY"$'\n\n'"## AI Usage"$'\n\n'"Disclaimer: GLM-5.3-Flash by Z.ai was used to help develop, debug, and document this submission. All changes were reviewed and validated by a human."
          gh pr create --head "$BR" --title "New upstream release: $VER" --body "$BODY"
