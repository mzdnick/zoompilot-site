# Build and deploy the site to Cloudflare Pages.
#
# - push to main: build and deploy production
# - weekly cron: rebuild with a fresh build stamp so the static
#   fallback stays honest without a manual local deploy
# - workflow_dispatch: manual run from the Actions tab
# - after every deploy, a lighthouse job checks the live site and
#   fails if any category drops below 0.9
#
# Requires two repo secrets (Settings -> Secrets and variables ->
# Actions), from a Cloudflare API token with Cloudflare Pages: Edit:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Optional: PUBLIC_CF_BEACON, a Cloudflare Web Analytics token; when
# set, the built page carries the analytics beacon.
name: build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 7 * * 1" # Mondays, 07:37 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # never block a content deploy on a stamp refresh: if the GitHub
      # API hiccups, build with the committed stamp (the page also
      # refreshes it at runtime)
      - run: npm run stamp
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          PUBLIC_CF_BEACON: ${{ secrets.PUBLIC_CF_BEACON }}
      - name: deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name zoompilot-site --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # quality gate: runs against production after the deploy. Chrome is
  # preinstalled on ubuntu runners. Performance on shared runners is
  # noisy, so the gate runs three passes and takes the best score;
  # the other categories are steady and must pass every pass.
  # Baseline: 97-99 / 100 / 100 / 100. Thresholds: 0.9 per category.
  quality:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: lighthouse the live site (3 passes)
        run: |
          for i in 1 2 3; do
            npx -y lighthouse@13 "https://zoompilot-site.pages.dev/?ci=$i" \
              --output=json --output-path=lh$i.json --quiet \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo
          done
      - name: assert category scores
        run: |
          node -e '
            const runs = [1, 2, 3].map((i) => require("./lh" + i + ".json").categories);
            const best = {};
            for (const c of Object.keys(runs[0]))
              best[c] = Math.max(...runs.map((r) => r[c].score));
            for (const [k, v] of Object.entries(best))
              console.log(k, Math.round(v * 100));
            const low = Object.entries(best).filter(([, v]) => v < 0.9);
            if (low.length) {
              console.error("BELOW 0.9:", low.map(([k]) => k).join(", "));
              process.exit(1);
            }
          '
